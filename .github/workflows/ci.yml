name: CI

# Gate release PRs before the version bump is merged and auto-tagged. The
# release workflow repeats these checks because a tag is the release trigger;
# this workflow exists so broken branches cannot reach that point unnoticed.
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Keep the dependency set identical to the release workflow: Tauri's
      # Linux build needs WebKitGTK/GTK, and rodio needs ALSA headers.
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev

      - name: Install app dependencies
        run: npm ci

      - name: Lint app
        run: npm run lint

      - name: Typecheck app
        run: npx tsc --noEmit

      - name: Test app
        run: npm test

      - name: Build app
        run: npm run build

      - name: Clippy (Rust)
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy (Rust, ssh-askpass)
        working-directory: src-tauri
        run: cargo clippy --all-targets --features ssh-askpass -- -D warnings

      - name: Test (Rust)
        working-directory: src-tauri
        run: cargo test

      - name: Test (Rust, ssh-askpass)
        working-directory: src-tauri
        run: cargo test --features ssh-askpass

      - name: Build (Rust)
        working-directory: src-tauri
        run: cargo build --all-targets

      - name: Build askpass sidecar
        working-directory: src-tauri
        run: cargo build --features ssh-askpass --bin procmix-askpass

      - name: Install web UI dependencies
        working-directory: web
        run: npm ci

      - name: Build web UI
        working-directory: web
        run: npm run build
