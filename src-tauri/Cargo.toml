[package]
name = "procmix"
version = "0.10.5"
description = "ProcMix - cross-platform automation tool"
authors = ["Zenkin Egor Andreevich"]
edition = "2021"
license = "MIT"
publish = false
# The package now has two binaries — the app (`procmix`, from `src/main.rs`)
# and the `procmix-askpass` SSH helper. `cargo run` / `tauri dev` need to know
# which one is "the app", otherwise they fail with "could not determine which
# binary to run". Pin the main app as the default run target.
default-run = "procmix"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# Keep the dev build's on-disk footprint small without disabling incremental
# compilation. `line-tables-only` emits just enough debug info for readable
# backtraces (file/line) while dropping the full type/variable DWARF that makes
# debug binaries enormous, and `split-debuginfo = "unpacked"` keeps that debug
# info OUT of the final binary (separate object files) so the linked artifact
# stays lean. Incremental stays on. On non-unix targets cargo ignores the
# split setting gracefully.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "procmix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# SSH_ASKPASS helper for remote password auth. A sibling binary that links
# `procmix_lib` and prints the one-shot password parked in the keychain to
# stdout for `ssh`. Bundled alongside the app; see
# `docs/plans/ssh-remote-password-transient-keychain.md`. Explicit `[[bin]]`
# so the produced binary is named `procmix-askpass` rather than `askpass`.
#
# Gated behind the `ssh-askpass` feature (off by default) via
# `required-features`, so a plain `cargo build` / `tauri build` / `cargo test`
# does NOT build it. The feature is meaningful only on Unix — remote password
# auth is Unix-only (Win32-OpenSSH's SSH_ASKPASS handling is unreliable), so
# the helper is built (via `npm run build:askpass`) only for Unix bundles. On
# Windows the binary would compile to a no-op stub, so there is nothing to
# gain from building it there.
#
# IMPORTANT: the source lives at `src/askpass_main.rs`, NOT under `src/bin/`.
# tauri-cli's bundler scans `tauri_dir/src/bin/` and auto-adds every file there
# as an app binary to bundle. Released CLI versions don't reliably skip a
# `required-features`-gated `[[bin]]` from that scan, so a file in `src/bin/`
# makes the Windows bundle try to ship a never-built `procmix-askpass.exe`
# (off there) and fail with "cannot find the file specified". Keeping the
# source out of `src/bin/` removes it from the scan entirely; the `[[bin]]`
# below still builds it via `--features ssh-askpass` on Unix.
[[bin]]
name = "procmix-askpass"
path = "src/askpass_main.rs"
required-features = ["ssh-askpass"]

[features]
# Build the `procmix-askpass` sidecar. Enabled by `npm run build:askpass`
# (Unix). Off by default so default builds/tests skip the extra binary.
ssh-askpass = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "devtools"] }
tauri-plugin-opener = "2"
# Temp batch file fed to `sftp` as a real (seekable, regular-file) stdin on the
# password-auth path — a pipe stdin makes OpenSSH's `put` write a 0-byte remote
# file. See `core::sftp::client::run_op`. Auto-deletes on drop.
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.52.3", features = ["full"] }
# Built-in HTTP server for the optional REST API (`POST /api/command/{ref}/run`,
# `POST /api/workflow/{ref}/run`). Runs as a Tokio task on the SAME runtime tauri
# already uses (tokio with `features = ["full"]`), so no second runtime is
# introduced. `axum` is chosen over a hand-rolled hyper service for its typed
# extractors and built-in graceful shutdown. Bound to localhost by default; see
# docs/http-server.md and core::http_server. Default features cover routing,
# JSON, and the `tokio` TCP listener used by `axum::serve`.
axum = "0.7"
# Constant-time byte comparison for the Bearer-token check in
# core::http_server::auth — defeats timing side-channels that a naive `==`
# would leak. Tiny, pure-Rust, no_std-friendly.
subtle = "2"
# CSPRNG used ONLY to generate the API Bearer token (security::api_token::generate).
# `getrandom` would also work but `rand` gives a clearer `rng.fill_bytes` API and
# is already in the transitive tree via other crates.
rand = "0.8"
# Zero-config LAN discovery (mDNS / DNS-SD). When the HTTP server starts it
# announces a `procmix.local` hostname + an `_http._tcp` service so other
# machines on the same subnet can reach it by name (macOS/Windows resolve
# `.local` out of the box; Linux via avahi). Pure-Rust, cross-platform, no
# native dependency. See core::http_server::mdns and docs/http-server.md.
mdns-sd = "0.11"
# Enumerate local network interfaces to pick the machine's LAN IPv4 for the
# mDNS A-record and the "reachable at" address shown in the UI. `local-ip-address`
# is tiny and cross-platform (no `ifconfig`/`ip` shelling out).
local-ip-address = "0.6"
# Cooperative cancellation token for the workflow runner. A `oneshot` cannot
# fan a cancel signal out to N concurrent fork branches (it is single-consumer
# and not clonable), so the engine uses a `CancellationToken`: it is cheaply
# cloned into every branch and `.cancel()` wakes all of them at once. Only the
# `rt` feature is enabled (it gates `tokio_util::sync::CancellationToken`) —
# none of the codec / io adapters are pulled in.
tokio-util = { version = "0.7", features = ["rt"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite"] }
uuid = { version = "1", features = ["v4"] }
dirs = "5"
tauri-plugin-single-instance = "2.4.2"
tauri-plugin-global-shortcut = "2.3.1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
thiserror = "2"

# Structured, level-based diagnostic logging (replaces the previous ad-hoc
# `eprintln!` calls scattered across the backend). `tracing` provides the
# `error!`/`warn!`/`info!`/`debug!` macros and span support for request flows;
# `tracing-subscriber` provides the `fmt` subscriber installed once in `run()`
# so events surface on stderr (with an `RUST_LOG`-style `EnvFilter`, defaulting
# to `info`). Only the lightweight `fmt` + `env-filter` features are enabled.
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "fmt",
    "env-filter",
    "ansi",
] }

# --- Licensing (client-side, verify-only) ---
#
# The lease / DTO / error-code wire contract is declared LOCALLY in
# `security::license::contract` (mirroring the server's `proc_mix_license_server`
# format, pinned by contract tests there) so the client does not depend on the
# server's private repository. See docs/plans/procmix-license-server-rust-axum-kms-implementation-plan.md
# and the server's docs/licensing.md.

# Ed25519 verification of the server-signed lease. Verify-only on the
# client: the binary embeds the server's PUBLIC key (see
# `security::license::lease`) and never holds any private key, so a lease
# cannot be forged client-side.
ed25519-dalek = "2"

# base64url (no padding) decoding of the compact `header.payload.sig`
# lease token. Matches the server's `URL_SAFE_NO_PAD` encoding.
base64 = "0.22"

# SHA-256 for the composite-HWID hash. Raw machine identifiers are hashed
# (salt + pepper) before they ever leave the device.
sha2 = "0.10"

# RFC 3339 timestamp parsing for lease expiry / signed-clock comparisons.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# Loads `app/.env` at startup so local dev can set overrides (e.g.
# PROCMIX_PLUGIN_CATALOG) without exporting shell vars. Best-effort: a missing
# `.env` is not an error. Only read in the binary entrypoint.
dotenvy = "0.15"

# Cron expression parser used by the Scheduler (core::scheduler). PARSE /
# next-fire only — the scheduling loop itself is hand-written (a single Tokio
# task), so the crate never owns a job registry or a runtime. The crate uses a
# 7-field cron format (sec min hour dom month dow year); the user types the
# classic 5-field Unix form, which `core::scheduler::cron_spec` normalises to
# 7 fields before parsing. Depends on chrono ~0.4 (already a dependency).
cron = "0.15"

# HTTPS client for the activate / trial / refresh calls to the license
# server. `rustls` (NOT native-tls / OpenSSL) keeps the dependency tree
# pure-Rust and the cross-platform build simple. `json` for serde bodies.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# Regular-expression engine for the `regex` output parser in
# `core::extractor`. The `regex` crate is RE2-style (linear-time, no
# catastrophic backtracking), which bounds the worst case for
# user-supplied patterns parsing command stdout.
regex = "1"

# Sandboxed JavaScript engine for the `javascript` output parser in
# `core::extractor` / `core::js_parser`. A fresh `Context::default()`
# exposes ONLY ECMAScript builtins (Object/Array/Math/JSON/Date/RegExp/…) —
# it has NO filesystem, network, process, env, timer, or host access by
# construction. Host capabilities live in the SEPARATE `boa_runtime` crate,
# which we deliberately DO NOT depend on, and we register zero native
# functions/globals, so user `parse(data)` code can touch nothing but its
# `data` argument and the JS standard library. Pure Rust → compiles on every
# target (no `#[cfg]` gate). Resource abuse is bounded by an instruction
# budget (kills infinite loops) and a source-size cap (see `core::js_parser`).
boa_engine = "0.20"

# Native open/save file dialogs for the JSON Import/Export feature.
# Used INSIDE Tauri commands (not as a JS plugin) so the app keeps a
# minimal allowlist — `rfd` opens the OS dialog and `std::fs` does the
# raw IO, while serialization/validation stays in the TS layer where the
# Command/Workflow types live. The blocking dialog is run via
# `tokio::task::spawn_blocking` so it never stalls the async command
# runtime.
rfd = "0.15"

# Persist the main window's position and size (including which monitor it
# was on) across launches, restoring it on the next startup. Desktop-only:
# the plugin is meaningless on mobile, so it is gated to desktop targets.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-window-state = "2.4.1"

# OS keychain access for storing the sudo password used by the
# "Run as administrator" feature on Unix. On Windows the keychain is
# never read (UAC handles elevation); the crate still compiles cleanly
# there thanks to `windows-native`.
#
# `vendored` pulls in a bundled libdbus build so users don't need
# `libdbus-1-dev` on their system at compile time.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "vendored"] }

# Raw netlink socket for the proc connector (cn_proc) — the Linux backend
# for Process Capture. We parse the fixed-layout connector messages by hand
# against libc structs (`nlmsghdr` -> `cn_msg` -> `proc_event`), so we only
# need a thin socket layer plus the C constants, not a full netlink
# abstraction. `libc` is already present transitively; declaring it here
# makes the dependency explicit and Linux-scoped. See
# `src-tauri/src/platform/cn_proc.rs` and `docs/process-capture.md`.
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

# Event Tracing for Windows (ETW) subscription for Process Capture — the
# background "command recorder" that observes process births and surfaces
# their command lines. Windows-only: the crate (and the entire feature) is
# gated to Windows; other platforms use their own backend (netlink cn_proc
# on Linux) or return the `CAPTURE_UNSUPPORTED` sentinel. See
# `docs/process-capture.md`.
ferrisetw = "1.2"

# Win32 bindings for the Process Capture target picker: `list_capture_targets`
# enumerates running processes via the Toolhelp snapshot
# (`CreateToolhelp32Snapshot(TH32CS_SNAPPROCESS)`), the Windows analogue of the
# Linux `/proc` walk. Pinned to 0.57 so it shares the version ferrisetw already
# locks (no new `windows` major in the tree). See the scoping plan §4.1.
windows = { version = "0.57", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
] }

# Enable Tauri's `test` feature for our test target only — exposes
# `tauri::test::mock_app()` and the MockRuntime needed for integration
# tests that spawn real child processes through `spawn_execution`.
# Keeping it as a dev-dependency only avoids pulling test scaffolding
# into release builds.
[dev-dependencies]
tauri = { version = "2", features = ["test"] }

# `ServiceExt::oneshot` lets the HTTP-server integration tests drive the axum
# `Router` directly (one request → one response) WITHOUT binding a real TCP
# port or a live keychain — see tests/http_server_api.rs. Dev-only.
tower = { version = "0.5", features = ["util"] }

# Statistical micro-benchmark harness for the output-extraction hot path
# (`core::extractor`) and the sandboxed JS parser (`core::js_parser`).
# Dev-only — never linked into the app binary. Run with `cargo bench`.
# `html_reports` is off to keep the dependency tree (and CI output) lean.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

# Output-extraction benchmarks: the parser pipeline (raw/lines/json/regex/
# keyValue/table) plus the JS `parse(data)` step. `harness = false` lets
# Criterion own `main` instead of the default libtest harness.
[[bench]]
name = "extraction"
harness = false

